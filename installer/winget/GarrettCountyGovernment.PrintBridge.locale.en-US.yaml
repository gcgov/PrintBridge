ShortDescription: Lets web applications print PDF files on desktop printers through a local HTTP API.
Description: |-
  PrintBridge is a Windows tray app that prints PDF files for web applications.
  A web page sends a PDF file to the local HTTP API on 127.0.0.1.
  PrintBridge sends the file to the Windows print spooler, with no print dialog.
  An administrator maps named queues to installed printers.
  An administrator also lists the website origins that can print.
